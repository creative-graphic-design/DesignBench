[project]
name = "design-bench"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shunsuke KITADA", email = "shunsuke.kitada.0831@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "clip",
    "datasets>=4.5.0",
    "loguru>=0.7.3",
    "openai>=2.16.0",
    "opencv-python>=4.13.0.90",
    "python-dotenv>=1.2.1",
    "retry>=0.9.2",
    "scikit-image>=0.26.0",
    "selenium>=4.40.0",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "tqdm>=4.67.1",
    "webdriver-manager>=4.0.2",
]

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=6.0.0", "ruff>=0.1.5", "ty>=0.0.10"]

[tool.uv.sources]
clip = { git = "https://github.com/openai/CLIP" }
